name: VPhone CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Server — lint + test
  # ──────────────────────────────────────────────────────────────
  server:
    name: Server (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  # ──────────────────────────────────────────────────────────────
  # React Native client — type-check + lint
  # (Full APK/IPA build done via EAS Build on merge to main)
  # ──────────────────────────────────────────────────────────────
  client:
    name: RN Client (type-check + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true

      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ──────────────────────────────────────────────────────────────
  # EAS Build — Android debug APK on main branch
  # ──────────────────────────────────────────────────────────────
  eas-android:
    name: EAS Android build
    runs-on: ubuntu-latest
    needs: client
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (Android debug)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Docker — build & push server image to GHCR
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker (server)
    runs-on: ubuntu-latest
    needs: server
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository }}/server:latest
